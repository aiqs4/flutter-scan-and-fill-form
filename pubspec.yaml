name: flutter_scan_and_fill_form
description: A Flutter application for document edge detection, scanning, OCR, and Supabase integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera and Image Processing
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # OCR
  google_ml_kit: ^0.16.3
  
  # Supabase Integration
  supabase_flutter: ^2.0.0
  
  # State Management & Utilities
  provider: ^6.1.1
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  
  # UI Components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
